<form method="POST" action="/articles/{{ article.get_id() }}/edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <input type="text" name="name" value="{{ article.get_name() }}">
    <textarea name="text">{{ article.get_text() }}</textarea>

    <button type="submit">Сохранить</button>
</form>
